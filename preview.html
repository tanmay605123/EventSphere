      {

        description: "From Figma tokens to reusable Tailwind & React component libraries. Deep dive into accessible components, compound components, token synchronization, and micro-interactions.",
        image: "https://images.unsplash.com/photo-1581291518857-4e27b48ff24e?auto=format&fit=crop&w=1200&q=80",
        date: "2026-12-10",
        time: "02:00 PM",
        venue: "Digital Arts Academy, Denver, CO",
        organizer: "UI/UX Collective",
        totalSeats: 50,
        seatsLeft: 11,
        price: 40
      }
    ];

    // --- LOCAL STORAGE DATA SERVICE ---
    const StorageService = {
      getEvents() {
        const stored = localStorage.getItem('es_events');
        if (!stored) {
          localStorage.setItem('es_events', JSON.stringify(INITIAL_EVENTS));
          return INITIAL_EVENTS;
        }
        return JSON.parse(stored);
      },
      saveEvents(events) {
        localStorage.setItem('es_events', JSON.stringify(events));
      },
      getUser() {
        const user = localStorage.getItem('es_user');
        return user ? JSON.parse(user) : null;
      },
      setUser(user) {
        if (user) {
          localStorage.setItem('es_user', JSON.stringify(user));
        } else {
          localStorage.removeItem('es_user');
        }
      },
      getRegistrations() {
        const regs = localStorage.getItem('es_registrations');
        return regs ? JSON.parse(regs) : [];
      },
      saveRegistrations(regs) {
        localStorage.setItem('es_registrations', JSON.stringify(regs));
      }
    };

    // --- ICONS (SVG implementations matching Lucide) ---
    const IconSparkles = () => (
      <svg className="w-5 h-5 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>

    );

    const IconCalendar = ({ className = "w-4 h-4 text-primary-600" }) => (

      </svg>
    );

    const IconClock = ({ className = "w-4 h-4 text-slate-400" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
    );

    const IconMapPin = ({ className = "w-4 h-4 text-slate-400" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
      </svg>
    );

    const IconArrowRight = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
      </svg>
    );

    const IconArrowLeft = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
      </svg>
    );

    const IconCheck = ({ className = "w-6 h-6" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    );

    const IconSearch = ({ className = "w-4 h-4 text-slate-400" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
    );

    const IconTicket = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/>
      </svg>
    );

    // --- APPLICATION COMPONENT ---
    function App() {
      // Global State
      const [user, setUser] = useState(() => StorageService.getUser());
      const [events, setEvents] = useState(() => StorageService.getEvents());
      const [registrations, setRegistrations] = useState(() => StorageService.getRegistrations());
      const [toasts, setToasts] = useState([]);

      // Navigation: 'login' | 'home' | 'details' | 'confirmation' | 'profile'
      const [currentPage, setCurrentPage] = useState(() => (user ? 'home' : 'login'));
      const [selectedEventId, setSelectedEventId] = useState(null);
      const [currentConfirmation, setCurrentConfirmation] = useState(null);

      // Save user to storage
      useEffect(() => {
        StorageService.setUser(user);
        if (!user && currentPage !== 'login') {
          setCurrentPage('login');
        }
      }, [user]);

      // Save events to storage
      useEffect(() => {
        StorageService.saveEvents(events);
      }, [events]);

      // Save registrations
      useEffect(() => {
        StorageService.saveRegistrations(registrations);
      }, [registrations]);

      // Toast notification helper
      const addToast = (type, message) => {
        const id = Date.now() + Math.random().toString(36).substring(2, 7);
        setToasts(prev => [...prev, { id, type, message }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 3500);
      };

      // Navigate helper
      const navigate = (page, params = {}) => {
        if (params.eventId) setSelectedEventId(params.eventId);
        if (params.confirmation) setCurrentConfirmation(params.confirmation);
        setCurrentPage(page);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Logout handler
      const handleLogout = () => {
        setUser(null);
        setCurrentPage('login');
        addToast('info', 'You have been logged out.');
      };

      return (
        <div className="min-h-screen flex flex-col bg-surface-bg text-slate-800">
          
          {/* Top Bar on every page after login */}
          {user && currentPage !== 'login' && (
            <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 shadow-sm">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 py-3">
                <div className="flex items-center justify-between h-full relative">
                  
                  {/* Round Logo (Left) */}
                  <div
                    onClick={() => navigate('home')}
                    className="flex items-center gap-2.5 cursor-pointer group"
                    title="EventSphere - Home"
                  >
                    <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-primary-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-primary-500/25 group-hover:scale-105 transition-transform">
                      <IconSparkles />
                    </div>
                    <span className="hidden sm:inline-block font-bold text-slate-900 text-lg tracking-tight">
                      Event<span className="text-primary-600">Sphere</span>
                    </span>
                  </div>

                  {/* Application Name (Center) */}
                  <div className="absolute left-1/2 -translate-x-1/2 text-center pointer-events-none">
                    <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 flex items-center gap-1">
                      <span className="text-primary-600">Event</span>Sphere
                    </h1>
                  </div>

                  {/* Profile Avatar (Right) */}
                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => navigate('profile')}
                      className="flex items-center gap-2 p-1 rounded-full hover:bg-slate-100 transition-colors"
                      title="View Profile"
                    >
                      <div className="w-10 h-10 rounded-full bg-primary-100 border-2 border-primary-600 text-primary-700 font-bold flex items-center justify-center shadow-sm">
                        {user.name ? user.name.slice(0, 2).toUpperCase() : 'U'}
                      </div>
                    </button>
                  </div>

                </div>
              </div>
            </header>
          )}

          {/* Page Routing */}
          <main className="flex-1">
            {currentPage === 'login' && (
              <LoginPage
                onSuccess={(newUser) => {
                  setUser(newUser);
                  setCurrentPage('home');
                  addToast('success', `Welcome to EventSphere, ${newUser.name}!`);
                }}
                addToast={addToast}
              />
            )}

            {currentPage === 'home' && (
              <HomePage
                events={events}
                onSelectEvent={(id) => navigate('details', { eventId: id })}
                addToast={addToast}
              />
            )}

            {currentPage === 'details' && (
              <EventDetailsPage
                eventId={selectedEventId}
                events={events}
                user={user}
                registrations={registrations}
                onBack={() => navigate('home')}
                onRegisterSuccess={(event, reg) => {
                  // Decrement seats
                  const updatedEvents = events.map(e => {
                    if (e.id === event.id) {
                      return { ...e, seatsLeft: Math.max(0, e.seatsLeft - 1) };
                    }
                    return e;
                  });
                  setEvents(updatedEvents);
                  setRegistrations(prev => [reg, ...prev]);
                  navigate('confirmation', { confirmation: { event, registration: reg } });
                  addToast('success', 'Registration confirmed! Check your QR pass.');
                }}
                addToast={addToast}
              />
            )}

            {currentPage === 'confirmation' && (
              <ConfirmationPage
                confirmation={currentConfirmation}
                user={user}
                onViewMyEvents={() => navigate('profile')}
                onBackHome={() => navigate('home')}
              />
            )}

            {currentPage === 'profile' && (
              <ProfilePage
                user={user}
                events={events}
                registrations={registrations}
                onUpdateUser={(updated) => {
                  setUser(updated);
                  addToast('success', 'Profile updated successfully!');
                }}
                onCancelRegistration={(regId, eventId) => {
                  // Mark registration cancelled
                  const updatedRegs = registrations.map(r => r.id === regId ? { ...r, status: 'cancelled' } : r);
                  setRegistrations(updatedRegs);
                  // Increment seat
                  const updatedEvents = events.map(e => e.id === eventId ? { ...e, seatsLeft: e.seatsLeft + 1 } : e);
                  setEvents(updatedEvents);
                  addToast('info', 'Registration cancelled. Seat has been released.');
                }}
                onLogout={handleLogout}
                onViewTicket={(reg, event) => {
                  navigate('confirmation', { confirmation: { event, registration: reg } });
                }}
                addToast={addToast}
              />
            )}
          </main>

          {/* Toast Notification Container */}
          <div className="fixed top-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4">
            {toasts.map(toast => (
              <div
                key={toast.id}
                className="pointer-events-auto flex items-center gap-3 p-4 bg-white rounded-xl shadow-lg border border-slate-100 animate-fade-in"
              >
                <div className="shrink-0">
                  {toast.type === 'success' && <div className="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>}
                  {toast.type === 'error' && <div className="w-2.5 h-2.5 rounded-full bg-rose-500"></div>}
                  {toast.type === 'info' && <div className="w-2.5 h-2.5 rounded-full bg-primary-600"></div>}
                </div>
                <p className="text-sm font-medium text-slate-800">{toast.message}</p>
              </div>
            ))}
          </div>

        </div>
      );
    }

    // --- PAGE 1: LOGIN / SIGN-UP PAGE ---
    function LoginPage({ onSuccess, addToast }) {
      const [isLogin, setIsLogin] = useState(true);
      const [showPassword, setShowPassword] = useState(false);
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [phone, setPhone] = useState('');
      const [errors, setErrors] = useState({});

      const handleSubmit = (e) => {
        e.preventDefault();
        const errs = {};
        if (!isLogin && !name.trim()) errs.name = 'Please enter your name';
        if (!email.trim() || !email.includes('@')) errs.email = 'Valid email is required';
        if (!password || password.length < 6) errs.password = 'Password must be 6+ chars';

        if (Object.keys(errs).length > 0) {
          setErrors(errs);
          return;
        }

        const newUser = {
          name: isLogin ? (email.split('@')[0]) : name.trim(),
          email: email.trim().toLowerCase(),
          phone: phone.trim() || '+1 (555) 019-2831',
          createdAt: new Date().toISOString()
        };

        onSuccess(newUser);
      };

      const fillDemo = () => {
        setIsLogin(true);
        setEmail('demo@eventsphere.com');
        setPassword('password123');
        setErrors({});
      };

      return (
        <div className="min-h-screen flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">

    // --- PAGE 2: HOME PAGE ---
    function HomePage({ events, onSelectEvent, addToast }) {
      const [search, setSearch] = useState('');
      const [category, setCategory] = useState('All');
      const [day, setDay] = useState('All');
      const [date, setDate] = useState('');
      const [time, setTime] = useState('All');
      const [page, setPage] = useState(1);

      const categories = ['All', 'Tech', 'Cultural', 'Sports', 'Workshops'];

      const filteredEvents = useMemo(() => {
        return events.filter(ev => {
          if (category !== 'All' && ev.category.toLowerCase() !== category.toLowerCase()) return false;
          if (search) {
            const q = search.toLowerCase();
            const match = ev.title.toLowerCase().includes(q) ||
                          ev.venue.toLowerCase().includes(q) ||
                          ev.description.toLowerCase().includes(q);
            if (!match) return false;
          }
          if (date && ev.date !== date) return false;
          return true;
        });
      }, [events, search, category, day, date, time]);

      const resetFilters = () => {
        setSearch('');
        setCategory('All');
        setDay('All');
        setDate('');
        setTime('All');
        setPage(1);
      };

      const itemsPerPage = 6;
      const totalPages = Math.ceil(filteredEvents.length / itemsPerPage) || 1;
      const displayedEvents = filteredEvents.slice((page - 1) * itemsPerPage, page * itemsPerPage);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
          {/* Hero */}
          <div className="mb-8">
            <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-primary-100 text-primary-700 mb-2">
              <IconSparkles />
              <span>Live Events in 2026</span>
            </span>
            <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
              Discover & Join Extraordinary Events
            </h2>
            <p className="text-slate-600 text-sm sm:text-base mt-1">
              Explore hackathons, music festivals, sports meets, and industry masterclasses.
            </p>
          </div>

          {/* Search & Filters Card */}
          <div className="card-base p-5 mb-8">
            {/* Search Input */}
            <div className="relative mb-4">
              <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <IconSearch />
              </div>
              <input
                type="text"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Search events by title, venue, or keywords..."
                className="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600"
              />
            </div>

            {/* Category Chips */}
            <div className="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
              <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider hidden sm:inline mr-1">
                Category:
              </span>
              {categories.map(cat => (
                <button
                  key={cat}
                  onClick={() => setCategory(cat)}
                  className={`px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-all ${
                    category === cat
                      ? 'bg-primary-600 text-white shadow-sm'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>

            {/* Filter Dropdowns (Day, Date, Time) */}
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 pt-4 border-t border-slate-100 mt-2">
              <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1">Day</label>
                <select
                  value={day}
                  onChange={(e) => setDay(e.target.value)}
                  className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none"
                >
                  <option value="All">All Days</option>
                  <option value="Today">Today</option>
                  <option value="Tomorrow">Tomorrow</option>
                  <option value="Weekend">Weekend</option>
                  <option value="Weekdays">Weekdays</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1">Date</label>
                <input
                  type="date"
                  value={date}
                  onChange={(e) => setDate(e.target.value)}
                  className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1">Time</label>
                <select
                  value={time}
                  onChange={(e) => setTime(e.target.value)}
                  className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none"
                >
                  <option value="All">All Times</option>
                  <option value="Morning">Morning (&lt;12 PM)</option>
                  <option value="Afternoon">Afternoon (12–5 PM)</option>
                  <option value="Evening">Evening (5 PM+)</option>
                </select>
              </div>

              <div className="flex items-end">
                <button
                  onClick={resetFilters}
                  className="w-full py-2 px-3 text-sm font-semibold rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700"
                >
                  Reset Filters
                </button>
              </div>
            </div>
          </div>

          {/* Results Count */}
          <div className="flex justify-between items-center mb-4 px-1">
            <p className="text-sm font-medium text-slate-600">
              Showing <span className="font-bold text-slate-900">{filteredEvents.length}</span> events
            </p>
          </div>

          {/* Responsive Grid: 1 col mobile, 2 col tablet, 3 col desktop */}
          {displayedEvents.length === 0 ? (
            <div className="card-base p-12 text-center max-w-md mx-auto my-8">
              <h3 className="text-lg font-bold text-slate-900">No events found</h3>
              <p className="text-sm text-slate-600 mt-1">Try clearing your filters or changing search keywords.</p>
              <button onClick={resetFilters} className="mt-4 btn-accent">Clear Filters</button>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {displayedEvents.map(event => (
                <div
                  key={event.id}
                  className="card-base card-hover flex flex-col overflow-hidden"
                >
                  {/* Banner Image */}
                  <div className="relative h-48 w-full bg-slate-100 overflow-hidden">
                    <img
                      src={event.image}
                      alt={event.title}
                      className="w-full h-full object-cover transition-transform duration-500 hover:scale-105"
                      loading="lazy"
                    />
                    <div className="absolute top-3 left-3">
                      <span className="px-2.5 py-1 text-xs font-semibold rounded-full bg-white/90 shadow-sm backdrop-blur-md">
                        {event.category}
                      </span>
                    </div>
                    <div className="absolute top-3 right-3">
                      <span className={`px-2.5 py-1 text-xs font-bold rounded-full text-white shadow-sm ${
                        event.price === 0 ? 'bg-emerald-600' : 'bg-slate-900'
                      }`}>
                        {event.price === 0 ? 'Free' : `$${event.price}`}
                      </span>
                    </div>
                    <div className="absolute bottom-2.5 left-3">
                      <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-900/80 text-white backdrop-blur-md">
                        {event.seatsLeft <= 0 ? 'Event Full' : `${event.seatsLeft} seats left`}
                      </span>
                    </div>
                  </div>

                  {/* Card Body */}
                  <div className="p-5 flex-1 flex flex-col justify-between">
                    <div>
                      <h3 className="text-lg font-bold text-slate-900 line-clamp-2 mb-3">
                        {event.title}
                      </h3>
                      <div className="space-y-1.5 text-sm text-slate-600 mb-4">
                        <div className="flex items-center gap-2">
                          <IconCalendar />
                          <span className="font-medium">{event.date}</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <IconClock />
                          <span>{event.time}</span>
                        </div>
                        <div className="flex items-start gap-2">
                          <IconMapPin />
                          <span className="truncate">{event.venue}</span>
                        </div>
                      </div>
                    </div>

                    <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                      <span className="text-xs text-slate-500">Capacity: <strong>{event.totalSeats}</strong></span>
                      <button
                        onClick={() => onSelectEvent(event.id)}
                        className="inline-flex items-center gap-1.5 text-sm font-semibold text-primary-600 hover:text-primary-700"
                      >
                        <span>View Details</span>
                        <IconArrowRight />
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Pagination */}
          {totalPages > 1 && (
            <div className="mt-8 flex justify-center gap-2">
              {Array.from({ length: totalPages }).map((_, i) => (
                <button
                  key={i}
                  onClick={() => setPage(i + 1)}
                  className={`w-10 h-10 rounded-xl font-semibold text-sm ${
                    page === i + 1 ? 'bg-primary-600 text-white' : 'bg-white border text-slate-700'
                  }`}
                >
                  {i + 1}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- PAGE 3: EVENT DETAILS PAGE ---
    function EventDetailsPage({ eventId, events, user, registrations, onBack, onRegisterSuccess, addToast }) {
      const event = events.find(e => e.id === eventId);
      if (!event) return null;

      const isRegistered = registrations.some(r => r.eventId === event.id && r.status === 'registered');
      const isFull = event.seatsLeft <= 0;
      const capacityPercent = Math.min(100, Math.round(((event.totalSeats - event.seatsLeft) / event.totalSeats) * 100));

      const handleRegister = () => {
        if (isRegistered) {
          addToast('info', 'You are already registered for this event!');
          return;
        }
        if (isFull) {
          addToast('error', 'Sorry, this event is already full.');
          return;
        }

        const registrationId = `REG-2026-${Math.random().toString(36).substring(2, 7).toUpperCase()}`;
        const newReg = {
          id: `reg-${Date.now()}`,
          userId: user.email,
          eventId: event.id,
          registrationId,
          status: 'registered',
          createdAt: new Date().toISOString()
        };

        onRegisterSuccess(event, newReg);
      };

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
          <button
            onClick={onBack}
            className="inline-flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-primary-600 mb-6"
          >
            <IconArrowLeft />
            <span>Back to Events</span>
          </button>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            {/* Left: Large Image & Organizer */}
            <div className="lg:col-span-6 space-y-6">
              <div className="card-base overflow-hidden relative">
                <img src={event.image} alt={event.title} className="w-full h-80 sm:h-96 object-cover" />
                <div className="absolute top-4 left-4">
                  <span className="px-3 py-1 text-xs font-bold rounded-full bg-white/95 text-primary-700 shadow-sm">
                    {event.category}
                  </span>
                </div>
                <div className="absolute top-4 right-4">
                  <span className={`px-3 py-1 text-xs font-bold rounded-full text-white shadow-sm ${
                    event.price === 0 ? 'bg-emerald-600' : 'bg-slate-900'
                  }`}>
                    {event.price === 0 ? 'Free Entry' : `$${event.price}`}
                  </span>
                </div>
              </div>

              <div className="card-base p-5 flex items-center justify-between">
                <div>
                  <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Organizer</p>
                  <p className="text-base font-bold text-slate-900">{event.organizer}</p>
                </div>
                <span className="text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg text-xs font-semibold">
                  Verified Host
                </span>
              </div>
            </div>

            {/* Right: Details & CTA */}
            <div className="lg:col-span-6">
              <div className="card-base p-6 sm:p-8 space-y-6">
                <div>
                  <span className="text-xs font-bold text-primary-600 uppercase tracking-wider bg-primary-50 px-2.5 py-0.5 rounded-md">
                    {event.category}
                  </span>
                  <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-2">
                    {event.title}
                  </h1>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
                  <div className="flex items-start gap-2.5">
                    <IconCalendar />
                    <div>
                      <p className="text-xs text-slate-400">Date</p>
                      <p className="text-sm font-semibold text-slate-800">{event.date}</p>
                    </div>
                  </div>
                  <div className="flex items-start gap-2.5">
                    <IconClock />
                    <div>
                      <p className="text-xs text-slate-400">Time</p>
                      <p className="text-sm font-semibold text-slate-800">{event.time}</p>
                    </div>
                  </div>
                  <div className="flex items-start gap-2.5 sm:col-span-2">
                    <IconMapPin />
                    <div>
                      <p className="text-xs text-slate-400">Venue</p>
                      <p className="text-sm font-semibold text-slate-800">{event.venue}</p>
                    </div>
                  </div>
                </div>

                <div>
                  <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider mb-2">Description</h3>
                  <p className="text-slate-600 text-sm leading-relaxed">{event.description}</p>
                </div>

                <div className="space-y-2">
                  <div className="flex justify-between text-xs font-semibold">
                    <span>Seat Availability</span>
                    <span>{event.seatsLeft} of {event.totalSeats} seats remaining</span>
                  </div>
                  <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                    <div
                      className={`h-full rounded-full transition-all ${
                        capacityPercent >= 85 ? 'bg-rose-500' : 'bg-emerald-500'
                      }`}
                      style={{ width: `${capacityPercent}%` }}
                    ></div>
                  </div>
                </div>

                <div className="pt-4 border-t border-slate-100">
                  {isRegistered ? (
                    <button
                      disabled
                      className="w-full bg-emerald-600 text-white font-semibold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 cursor-default"
                    >
                      <IconCheck />
                      <span>Registered</span>
                    </button>
                  ) : isFull ? (
                    <button
                      disabled
                      className="w-full bg-slate-200 text-slate-500 font-semibold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 cursor-not-allowed"

                      <span>Event Full</span>
                    </button>
                  ) : (
                    <button
                      onClick={handleRegister}
                      className="w-full btn-accent justify-center py-3.5 px-6 text-base shadow-md"
                    >
                      <span>Register Now ({event.price === 0 ? 'Free' : `$${event.price}`})</span>
                    </button>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- PAGE 4: REGISTRATION CONFIRMATION PAGE ---

        if (window.confetti) {
          window.confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      }, []);

      useEffect(() => {
        if (qrCanvasRef.current && reg) {
          QRCode.toCanvas(
            qrCanvasRef.current,
            JSON.stringify({
              regId: reg.registrationId,
              event: event?.title,
              user: user?.name,
              email: user?.email,
            }),
            { width: 140, margin: 1 }
          );

                <span className="text-xs font-bold text-primary-600 bg-primary-50 px-2.5 py-0.5 rounded-md uppercase">
                  {event.category}

                <p className="text-xs text-slate-400">Time</p>
                <p className="font-semibold text-slate-800">{event.time}</p>
              </div>
              <div>
                <p className="text-xs text-slate-400">Venue</p>
                <p className="font-semibold text-slate-800 truncate">{event.venue}</p>
              </div>
            </div>

            {/* QR Code and Reg ID */}
            <div className="pt-6 flex flex-col sm:flex-row items-center justify-between gap-6 bg-slate-50 p-4 rounded-xl mt-4">
              <div>
                <p className="text-xs font-semibold text-slate-400 uppercase">Registration ID</p>
                <p className="text-xl font-mono font-bold text-primary-700">{reg.registrationId}</p>
                <p className="text-xs text-slate-500 mt-2">Attendee: <strong>{user?.name}</strong> ({user?.email})</p>
              </div>

              <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-200">
                <canvas ref={qrCanvasRef}></canvas>
                <p className="text-[10px] text-center text-slate-400 font-mono mt-1">Scan at entrance</p>
              </div>
            </div>
          </div>

          {/* Action Buttons */}
          <div className="flex flex-col sm:flex-row gap-3 w-full max-w-md">
            <button onClick={onViewMyEvents} className="flex-1 btn-accent justify-center py-3">
              <IconTicket />
              <span>View My Events</span>
            </button>
            <button onClick={onBackHome} className="flex-1 btn-secondary justify-center py-3">
              Back to Home
            </button>
          </div>
        </div>
      );
    }

    // --- PAGE 5: PROFILE PAGE ---
    function ProfilePage({ user, events, registrations, onUpdateUser, onCancelRegistration, onLogout, onViewTicket, addToast }) {
      const [name, setName] = useState(user?.name || '');
      const [phone, setPhone] = useState(user?.phone || '');
      const [currentPass, setCurrentPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [confirmPass, setConfirmPass] = useState('');
      const [eventTab, setEventTab] = useState('upcoming');

      const myRegs = registrations.filter(r => r.userId === user?.email);

      const upcoming = myRegs.filter(r => {
        const ev = events.find(e => e.id === r.eventId);
        return ev && new Date(ev.date) >= new Date();
      });

      const past = myRegs.filter(r => {
        const ev = events.find(e => e.id === r.eventId);
        return ev && new Date(ev.date) < new Date();
      });

      const handleSavePersonal = (e) => {
        e.preventDefault();
        if (!name.trim()) {
          addToast('error', 'Name cannot be empty');
          return;
        }
        onUpdateUser({ ...user, name, phone });
      };

      const handlePasswordChange = (e) => {
        e.preventDefault();
        if (!currentPass || !newPass) {
          addToast('error', 'Please enter password fields');
          return;
        }
        if (newPass !== confirmPass) {
          addToast('error', 'New passwords do not match');
          return;
        }
        setCurrentPass('');
        setNewPass('');
        setConfirmPass('');
        addToast('success', 'Password updated successfully!');
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
          {/* Header */}
          <div className="card-base p-6 sm:p-8 mb-8 flex flex-col sm:flex-row items-center gap-6">
            <div className="w-20 h-20 rounded-full bg-gradient-to-tr from-primary-600 to-indigo-500 text-white font-bold text-2xl flex items-center justify-center shadow-lg">
              {user?.name ? user.name.slice(0, 2).toUpperCase() : 'U'}
            </div>
            <div className="flex-1 text-center sm:text-left">
              <h2 className="text-2xl font-bold text-slate-900">{user?.name}</h2>
              <p className="text-sm text-slate-500">{user?.email}</p>
              {user?.phone && <p className="text-xs text-slate-400 mt-0.5">{user?.phone}</p>}
            </div>
            <button
              onClick={onLogout}
              className="px-4 py-2 text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl"
            >
              Logout
            </button>
          </div>

          {/* 4 Cards in 2x2 Grid (Stacked on mobile) */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            {/* CARD A: Events Registered */}
            <div className="card-base p-6">
              <div className="flex justify-between items-center pb-4 border-b border-slate-100 mb-4">
                <h3 className="font-bold text-slate-900">Events Registered</h3>
                <div className="inline-flex p-1 bg-slate-100 rounded-xl text-xs font-semibold">
                  <button
                    onClick={() => setEventTab('upcoming')}
                    className={`px-3 py-1 rounded-lg ${eventTab === 'upcoming' ? 'bg-white text-primary-600 shadow-sm' : 'text-slate-600'}`}
                  >
                    Upcoming ({upcoming.length})
                  </button>
                  <button
                    onClick={() => setEventTab('past')}
                    className={`px-3 py-1 rounded-lg ${eventTab === 'past' ? 'bg-white text-primary-600 shadow-sm' : 'text-slate-600'}`}
                  >
                    Past ({past.length})
                  </button>
                </div>
              </div>

              {(eventTab === 'upcoming' ? upcoming : past).length === 0 ? (
                <div className="text-center py-8 text-slate-500 text-sm">
                  No {eventTab} registrations found.
                </div>
              ) : (
                <div className="space-y-3 max-h-80 overflow-y-auto pr-1">
                  {(eventTab === 'upcoming' ? upcoming : past).map(reg => {
                    const ev = events.find(e => e.id === reg.eventId);
                    if (!ev) return null;
                    const isCancelled = reg.status === 'cancelled';

                    return (
                      <div key={reg.id} className="p-3 bg-slate-50 border rounded-xl flex items-center justify-between gap-3">
                        <div className="min-w-0">
                          <p className="font-bold text-sm text-slate-900 truncate">{ev.title}</p>
                          <p className="text-xs text-slate-500">{ev.date} • {ev.venue}</p>
                          <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${
                            isCancelled ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-800'
                          }`}>
                            {isCancelled ? 'Cancelled' : 'Registered'}
                          </span>
                        </div>

                        {!isCancelled && (
                          <div className="flex gap-2 shrink-0">
                            <button
                              onClick={() => onViewTicket(reg, ev)}
                              className="px-2.5 py-1 text-xs font-semibold bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-lg"
                            >
                              Pass
                            </button>
                            <button
                              onClick={() => onCancelRegistration(reg.id, ev.id)}
                              className="px-2.5 py-1 text-xs font-semibold text-rose-600 hover:bg-rose-50 rounded-lg"
                            >
                              Cancel
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* CARD B: Personal Info */}
            <div className="card-base p-6">
              <h3 className="font-bold text-slate-900 pb-4 border-b border-slate-100 mb-4">Personal Info</h3>
              <form onSubmit={handleSavePersonal} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">Full Name</label>
                  <input
                    type="text"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    className="w-full px-3.5 py-2 text-sm bg-slate-50 border rounded-xl focus:outline-none"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">Email (Read Only)</label>
                  <input
                    type="email"
                    value={user?.email || ''}
                    disabled
                    className="w-full px-3.5 py-2 text-sm bg-slate-100 border text-slate-500 rounded-xl"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">Phone</label>
                  <input
                    type="tel"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    className="w-full px-3.5 py-2 text-sm bg-slate-50 border rounded-xl focus:outline-none"
                  />
                </div>
                <button type="submit" className="w-full btn-primary justify-center text-sm">
                  Save Changes
                </button>
              </form>
            </div>

            {/* CARD C: Password */}
            <div className="card-base p-6">
              <h3 className="font-bold text-slate-900 pb-4 border-b border-slate-100 mb-4">Password</h3>
              <form onSubmit={handlePasswordChange} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">Current Password</label>
                  <input
                    type="password"
                    value={currentPass}
                    onChange={(e) => setCurrentPass(e.target.value)}
                    placeholder="••••••••"
                    required
                    className="w-full px-3.5 py-2 text-sm bg-slate-50 border rounded-xl focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">New Password</label>
                  <input
                    type="password"
                    value={newPass}
                    onChange={(e) => setNewPass(e.target.value)}
                    placeholder="••••••••"
                    required
                    className="w-full px-3.5 py-2 text-sm bg-slate-50 border rounded-xl focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">Confirm Password</label>
                  <input
                    type="password"
                    value={confirmPass}
                    onChange={(e) => setConfirmPass(e.target.value)}
                    placeholder="••••••••"
                    required
                    className="w-full px-3.5 py-2 text-sm bg-slate-50 border rounded-xl focus:outline-none"
                  />
                </div>
                <button type="submit" className="w-full btn-primary justify-center text-sm">
                  Update Password
                </button>
              </form>
            </div>

            {/* CARD D: About */}
            <div className="card-base p-6 flex flex-col justify-between">
              <div className="space-y-3">
                <h3 className="font-bold text-slate-900 pb-4 border-b border-slate-100">About EventSphere</h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  <strong>EventSphere</strong> is a single platform where users discover all events in one place and register for them.
                </p>
                <div className="bg-slate-50 p-3 rounded-xl border text-xs space-y-1.5">
                  <div className="flex justify-between">
                    <span className="text-slate-400">Version:</span>
                    <span className="font-mono font-bold text-slate-800">v1.0.0</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Environment:</span>
                    <span className="font-semibold text-emerald-600">Active</span>
                  </div>
                </div>
                <p className="text-[11px] text-slate-400">
                  Data is cached in your browser. Live seat tracking, duplicate registration prevention, and instant QR generation are active.
                </p>
              </div>

              <div className="pt-6 border-t border-slate-100 mt-6">
                <button
                  onClick={onLogout}
                  className="w-full py-2.5 px-4 rounded-xl border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold text-sm transition-colors"
                >
                  Log Out
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
